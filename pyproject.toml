[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "finstream"
version = "0.1.0"
description = "Industrial ETL pipeline for financial data processing"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finstream --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["finstream"]
omit = [
    "tests/*",
    "finstream/api/routes/*",
    "finstream/api/main.py",
    "finstream/api/dependencies.py",
    "finstream/api/schemas.py",
    "finstream/cli/cli.py",
    "finstream/report/dashboard_renderer.py",
    "finstream/extract/rest_api_source.py",
    "finstream/extract/postgresql_source.py",
]

[tool.coverage.report]
fail_under = 90
